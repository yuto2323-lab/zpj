<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP运营设计 · Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
      :root {
        --tc-background: #FFFFFF;
        --tc-foreground: #1C1C1C;
        --tc-card: #FFFFFF;
        --tc-border: #E8E8E8;
        --tc-muted: #78716C;
        --tc-light-bg: #F8F8F8;
        --tc-footer-bg: #1C1C1C;
        --tc-primary: #FF7A1A;
        --tc-primary-light: #FFF0E0;
        --tc-primary-soft: #FFE8D0;
        --tc-mentor-card: #FCD34D;
        --tc-discussion-card: #4ADE80;
        --tc-badge-bg: #FFF0E0;
        --tc-badge-text: #FF7A1A;
        --tc-white: #FFFFFF;
        --tc-badge-pill-bg: rgba(255, 255, 255, 0.92);
        --tc-footer-tagline: #A8A29E;
        --tc-social-btn-bg: rgba(255, 255, 255, 0.08);
        --tc-footer-border: rgba(255, 255, 255, 0.08);
        --tc-footer-arrow: rgba(255, 255, 255, 0.4);
        --tc-radius-sm: 8px;
        --tc-radius-md: 12px;
        --tc-radius-lg: 16px;
        --tc-radius-xl: 16px;
        --tc-radius-full: 9999px;
        --tc-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --tc-shadow-card: 0 2px 8px rgba(0, 0, 0, 0.05);
        --tc-shadow-float: 0 4px 16px rgba(0, 0, 0, 0.08);
        --tc-shadow-cta: 0 4px 12px rgba(255, 122, 26, 0.05);
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: var(--tc-font-family);
        background: var(--tc-light-bg);
        color: var(--tc-foreground);
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        max-width: 375px;
        margin: 0 auto;
        background: var(--tc-card);
        min-height: 100vh;
        position: relative;
        padding-top: 57px;
        box-shadow: var(--tc-shadow-card);
      }

      .topnav {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 375px;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--tc-card);
        border-bottom: 1px solid var(--tc-border);
        box-sizing: border-box;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        color: var(--tc-foreground);
        border-radius: var(--tc-radius-full);
        cursor: pointer;
        padding: 0;
        text-decoration: none;
      }
      .icon-btn:active { background: var(--tc-light-bg); }
      .topnav-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        color: var(--tc-foreground);
      }

      .hero { line-height: 0; }
      .hero-img { display: block; width: 100%; height: auto; }

      .section { padding: 24px 16px; }
      .section.light { background: var(--tc-light-bg); }
      .h2 {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 14px;
        color: var(--tc-foreground);
      }

      .content-img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--tc-radius-md);
        margin: 0 0 14px;
        cursor: zoom-in;
      }
      .content-img:last-child { margin-bottom: 0; }

      .thumb-row-43 {
        display: flex;
        gap: 8px;
        margin: 0 0 14px;
      }
      .thumb-43 {
        flex: 1 1 0;
        width: calc((100% - 8px) / 2);
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: var(--tc-radius-md);
        display: block;
        cursor: zoom-in;
      }

      @media (min-width: 1024px) {
        .app { max-width: 960px; }
        .topnav { max-width: 960px; }
        .hero, .section { max-width: 430px; margin: 0 auto; }
      }
    </style>
</head>
<body>
    <main>
      <div class="app">
        <header class="topnav">
          <a class="icon-btn" href="../index.html" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </a>
          <h1 class="topnav-title">IP运营设计</h1>
          <span style="width:36px"></span>
        </header>

        <section class="hero"></section>

        <section class="section reveal">
          <div class="thumb-row-43">
            <img class="thumb-43" src="../assets/img/image_8_9a9ky.gif" alt="Design system token architecture" style="height: 257.625px;" data-lightbox>
            <img class="thumb-43" src="../assets/img/image_9_21uhzj.gif" alt="Component library showcase" data-lightbox>
          </div>
          <img src="../assets/img/image_10_yuotxx.jpg" alt="Poly Camping Season IP design case study" class="content-img" style="height: 961.62px;" data-lightbox>
        </section>

        <section class="section light reveal" style="background-color: rgb(248, 248, 248);">
          <h2 class="h2">What you'll learn</h2>
          <img src="../assets/img/image_11_wv5r9q.jpg" alt="Design systems component library case study" class="content-img" style="height: 1142.97px;" data-lightbox>
        </section>

        <section class="section reveal">
          <div class="instructor-card">
            <img src="../assets/img/image_12_whua.jpg" alt="David Kim, Design Systems Lead" class="content-img" style="height: 1182.64px;" data-lightbox>
          </div>
        </section>
      </div>
    </main>

    <button class="back-to-top" type="button" aria-label="返回顶部" data-back-to-top>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <script src="../assets/js/main.js"></script>
</body>
</html>
